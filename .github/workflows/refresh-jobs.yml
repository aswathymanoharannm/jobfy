name: Refresh job listings

on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-jobs.mjs"
      - "app.js"
      - "index.html"
      - ".github/workflows/refresh-jobs.yml"
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Refresh India-eligible listings
        run: node scripts/refresh-jobs.mjs
      - name: Commit refreshed job feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "Job feed is unchanged."
          else
            git commit -m "Refresh job listings"
            git push
          fi
